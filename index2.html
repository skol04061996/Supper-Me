<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Supper Me | Biometric Attendance & Employer Command</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        fontFamily: { sans: ['Inter','sans-serif'], mono: ['JetBrains Mono','monospace'] },
        colors: { obsidian:'#090d16', slateCard:'#111827', slateElevated:'#161f32', borderSubtle:'#1f2937', emeraldBrand:'#10b981', crimsonBrand:'#ef4444', amberBrand:'#f59e0b' }
      } }
    }
  </script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    body{background:#090d16;color:#f8fafc;font-family:'Inter',sans-serif;overflow-x:hidden}
    ::-webkit-scrollbar{width:6px;height:6px}::-webkit-scrollbar-track{background:#090d16}::-webkit-scrollbar-thumb{background:#1f2937;border-radius:9999px}
    .tabular-nums{font-variant-numeric:tabular-nums}.glass-card{background:rgba(17,24,39,.88);backdrop-filter:blur(12px);border:1px solid #1f2937}
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-5">
  <main class="glass-card max-w-xl w-full rounded-3xl p-8 text-center shadow-2xl">
    <div class="mx-auto w-14 h-14 rounded-2xl bg-emeraldBrand/15 border border-emeraldBrand/40 flex items-center justify-center text-emeraldBrand">
      <i data-lucide="utensils" class="w-7 h-7"></i>
    </div>
    <h1 class="mt-5 text-3xl font-extrabold tracking-tight">SUPPER ME</h1>
    <p class="mt-2 text-sm text-slate-400">Kolkata Hospitality Attendance &amp; Operations System</p>
    <p class="mt-6 text-slate-300">The original Supper Me staff kiosk version is being restored.</p>
    <a href="https://github.com/skol04061996/Supper-Me" class="inline-flex mt-6 py-3 px-5 rounded-xl bg-emeraldBrand text-obsidian font-bold text-sm">Open Repository</a>
  </main>
  <script>lucide.createIcons();</script>
</body>
</html>
